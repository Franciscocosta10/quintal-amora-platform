# Configuração da análise estática no SonarCloud (núcleo comum do portfólio).
# A análise roda pelo GitHub Actions (job "sonarcloud" em .github/workflows/ci.yml),
# depois dos testes, e recebe a cobertura do backend e do frontend.

# Confira no SonarCloud (Information do projeto) se a organização e a chave
# abaixo são as mesmas que ele criou ao importar o repositório.
sonar.organization=franciscocosta10
sonar.projectKey=Franciscocosta10_quintal-amora-platform
sonar.projectName=Quintal da Amora Platform

sonar.sourceEncoding=UTF-8

# Código da aplicação: API (Sails.js) e interface (React).
sonar.sources=backend/api,frontend/src
sonar.exclusions=frontend/src/**/*.test.js,frontend/src/**/*.test.jsx,frontend/src/test/**

# Testes: no backend ficam em backend/test; no frontend, ao lado dos componentes.
sonar.tests=backend/test,frontend/src
sonar.test.inclusions=backend/test/**/*.js,frontend/src/**/*.test.js,frontend/src/**/*.test.jsx

# Relatórios de cobertura gerados pelo c8 (backend) e pelo Vitest (frontend).
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info

# Ponto de entrada do React não tem lógica para testar.
sonar.coverage.exclusions=frontend/src/main.jsx
