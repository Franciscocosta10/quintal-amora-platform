# Pipeline de integração contínua do Quintal da Amora.
#
# Em todo push e pull request, backend e frontend rodam em paralelo:
# instalação limpa (npm ci), lint, testes com a cobertura mínima do
# portfólio (75% backend / 25% frontend) e, no frontend, o build de produção.
# Se qualquer passo falhar, o PR fica marcado como reprovado.
#
# Depois que os dois passam, o job "sonarcloud" faz a análise estática e de
# segurança, já com a cobertura dos testes.
#
# Por fim, só quando a main é atualizada (merge de PR), os jobs de deploy
# (CD) publicam o backend e o frontend na Azure e conferem se subiram.
# Nada é publicado se lint, testes, cobertura ou build falharem.

name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

# Um push novo na mesma branch cancela a execução anterior, que ficou velha.
# Na main não cancela, para nunca interromper um deploy no meio.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Sails.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # --ignore-scripts: não executa scripts de instalação dos pacotes
      # (proteção contra pacote comprometido; nenhuma dependência precisa deles).
      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Testes unitários com cobertura (mínimo 75%)
        run: npm run test:coverage

      - name: Guardar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-backend
          path: backend/coverage/
          retention-days: 14

  frontend:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # --ignore-scripts: não executa scripts de instalação dos pacotes
      # (proteção contra pacote comprometido; nenhuma dependência precisa deles).
      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Testes com cobertura (mínimo 25%)
        run: npm run test:coverage

      - name: Build de produção
        run: npm run build

      - name: Guardar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-frontend
          path: frontend/coverage/
          retention-days: 14

  sonarcloud:
    name: Análise estática (SonarCloud)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    # PRs vindos de forks não recebem o SONAR_TOKEN; nesses casos o job é pulado.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          # Histórico completo: o Sonar usa o git para saber o que é código novo.
          fetch-depth: 0

      - name: Baixar cobertura do backend
        uses: actions/download-artifact@v4
        with:
          name: cobertura-backend
          path: backend/coverage

      - name: Baixar cobertura do frontend
        uses: actions/download-artifact@v4
        with:
          name: cobertura-frontend
          path: frontend/coverage

      # Os relatórios citam os arquivos a partir de cada pasta (ex.: "api/...",
      # "src/..."); o Sonar lê a partir da raiz do repositório.
      - name: Ajustar caminhos da cobertura para a raiz do repositório
        run: |
          sed -i 's#^SF:#SF:backend/#' backend/coverage/lcov.info
          sed -i 's#^SF:#SF:frontend/#' frontend/coverage/lcov.info

      # Ação de terceiros fixada pelo SHA do commit (v5.3.2), e não pela tag,
      # que pode ser movida para outro código.
      - name: Análise SonarCloud
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5.3.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          # A configuração automática do scanner ignora sonar.sources e sonar.tests
          # do sonar-project.properties e contava os testes do backend como código.
          args: >
            -Dsonar.scanner.autoconfig.enabled=false

  deploy-backend:
    name: Deploy do backend (Azure)
    needs: [backend, frontend, sonarcloud]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: producao-backend
      url: ${{ steps.deploy.outputs.webapp-url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # Só as dependências de produção vão para o servidor.
      - name: Instalar dependências de produção
        working-directory: backend
        run: npm ci --omit=dev --ignore-scripts

      # Ação de terceiros fixada pelo SHA do commit (v3.0.8).
      - name: Publicar no Azure App Service
        id: deploy
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3.0.8
        with:
          app-name: quintal-amora-api
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: backend

      # Confere se a API subiu e conversa com o banco (rota de monitoramento).
      # O Sails leva alguns segundos para iniciar: tenta por até ~4 minutos.
      - name: Verificar /health
        env:
          URL_API: ${{ steps.deploy.outputs.webapp-url }}
        run: curl --fail --silent --show-error --retry 16 --retry-delay 15 --retry-all-errors "$URL_API/health"

  deploy-frontend:
    name: Deploy do frontend (Azure)
    needs: [backend, frontend, sonarcloud]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: producao-frontend
      url: ${{ steps.deploy.outputs.webapp-url }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      # O endereço da API entra no JavaScript na hora do build (variável
      # VITE_API_URL do repositório; não é segredo, fica visível no site).
      - name: Build de produção
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build

      # Na Azure, o comando de inicialização "pm2 serve /home/site/wwwroot
      # --no-daemon --spa" serve a pasta dist e resolve o F5 nas rotas do React.
      - name: Publicar no Azure App Service
        id: deploy
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3.0.8
        with:
          app-name: quintal-amora-web
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_FRONTEND }}
          package: frontend/dist

      - name: Verificar se o site responde
        env:
          URL_SITE: ${{ steps.deploy.outputs.webapp-url }}
        run: curl --fail --silent --show-error --output /dev/null --retry 16 --retry-delay 15 --retry-all-errors "$URL_SITE"
